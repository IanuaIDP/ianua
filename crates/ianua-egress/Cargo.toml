[package]
name = "ianua-egress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ianua-egress"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ianua-domain = { workspace = true }
ianua-app = { workspace = true }
ianua-infra = { workspace = true }
ianua-boot = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls-pemfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, features = ["ring"] }
tracing = { workspace = true }
ianua-workspace-hack = { version = "0.1", path = "../ianua-workspace-hack" }

[dev-dependencies]
ianua-app = { workspace = true, features = ["test-support"] }
ianua-domain = { workspace = true, features = ["test-support"] }
