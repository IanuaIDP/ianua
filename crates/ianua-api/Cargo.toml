[package]
name = "ianua-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = [
    "ianua-app/test-support",
    "ianua-domain/test-support",
    "ianua-assembly/test-support",
]

[lints]
workspace = true

[dependencies]
ianua-domain = { workspace = true }
ianua-app = { workspace = true }
ianua-assembly = { workspace = true }
ianua-macros = { path = "../ianua-macros" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
ipnet = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
utoipa-scalar = { workspace = true }
ianua-workspace-hack = { version = "0.1", path = "../ianua-workspace-hack" }

[dev-dependencies]
ianua-api = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
axum-test = "17"
base64 = { workspace = true }
