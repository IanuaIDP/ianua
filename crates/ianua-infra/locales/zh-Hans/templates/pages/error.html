{% extends "layout.html" %}
{% import "error_texts.html" as e %}

{% block title %}{{ status }} {{ e.title(kind) }}{% if look.name %} | {{ look.name }}{% endif %}{% endblock %}

{% block content %}
      <p class="status">错误 {{ status }}</p>
      <h1>{{ e.title(kind) }}</h1>
      <p class="subtitle">{{ e.advice(kind) }}</p>
      <p class="reference">参考编号： <code>{{ reference }}</code></p>
{% endblock %}
