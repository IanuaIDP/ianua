[lints]
workspace = true

[dependencies]
# Only to start the platform, through its own composition root, and to
# give it a test database cloned from the migrated template. Nothing else
# of ours: every request and answer goes over the wire in this crate's own
# types.
ianua-server = { workspace = true }
ianua-zero = { workspace = true }
ianua-dns = { workspace = true }
ianua-boot = { workspace = true }
ianua-infra = { workspace = true, features = ["test-support"] }

base64 = { workspace = true }
bytes = { workspace = true }
# A stand-in npm registry packs the tarballs it serves, as npm packs them.
flate2 = { workspace = true }
tar = { workspace = true }
# The stack's name server, which answers the records a tenant writes to
# prove a domain it brings.
hickory-proto = { workspace = true }
# GitHub's stand-in signs what it delivers with the registration's secret,
# as GitHub does.
hmac = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
# The person's own devices: a passkey's P-256 key and the hashes WebAuthn
# signs over, and an authenticator app's codes.
p256 = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
reqwest = { workspace = true, features = ["cookies"] }
rsa = { workspace = true, features = ["sha2"] }
# An outside SAML app reads the platform's documents and checks their
# signatures with code of its own, against the certificates it published.
roxmltree = { workspace = true }
# An application's LDAP client to the tenant directory, framing the
# protocol as the directory itself reads it.
ldap3_proto = "0.8"
tokio-util = { workspace = true, features = ["codec"] }
futures-util = { workspace = true, features = ["sink"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The breach service's stand-in hashes the passwords it lists, as the
# Pwned Passwords range service does.
sha1 = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, features = ["ring"] }
totp-rs = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
x509-cert = { workspace = true }
ianua-workspace-hack = { version = "0.1", path = "../ianua-workspace-hack" }
