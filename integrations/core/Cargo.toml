[package]
name = "ianua-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The integrations' SDK: the contract, step tables, access, answers and the checks every integration is built on"

[features]
# Checking an integration's steps against its service's published API
# description, for the integrations' own tests.
test-support = []

[lints]
workspace = true

[dependencies]
ianua-domain = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
roxmltree = { workspace = true }
rsa = { workspace = true, features = ["sha2"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt"] }
tokio-rustls = { workspace = true, features = ["ring"] }
url = { workspace = true }
webpki-roots = { workspace = true }
ianua-workspace-hack = { version = "0.1", path = "../../crates/ianua-workspace-hack" }

[dev-dependencies]
rcgen = { workspace = true }
rsa = { workspace = true, features = ["sha2", "getrandom"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
