[package]
name = "ianua-integration-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Protected data steps for Redis: commands run as a workflow's person through the gateway, over a stream route an admin opened to workflows"

[lints]
workspace = true

[dependencies]
ianua-domain = { workspace = true }
ianua-integration = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
redis = { workspace = true }
ianua-workspace-hack = { version = "0.1", path = "../../crates/ianua-workspace-hack" }

[dev-dependencies]
ianua-integration = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
