name: Dashboard

# The dashboard lives in dashboard/. It is checked, built and pushed to the
# container registry only when something under it changes, and never holds up
# the Rust CI. Nothing here deploys.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['dashboard/**', 'docker/Dockerfile.dashboard', 'deploy/helm/ianua-front/**', '.github/workflows/dashboard.yml']
  pull_request:
    branches: [main]
    paths: ['dashboard/**', 'docker/Dockerfile.dashboard', 'deploy/helm/ianua-front/**', '.github/workflows/dashboard.yml']

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

# Fixed in the bundle at build time. The dashboard's own /api routes forward
# to the backend each install points them at, so one image serves any install.
env:
  NEXT_PUBLIC_API_URL: /api

defaults:
  run:
    working-directory: dashboard

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check-messages
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # Only build once checks are green, and never on PRs.
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ianua-front
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: docker/Dockerfile.dashboard
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
