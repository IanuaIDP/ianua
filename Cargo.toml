ianua-integration-airtable = { path = "integrations/airtable" }
ianua-integration-hubspot = { path = "integrations/hubspot" }
ianua-integration-stripe = { path = "integrations/stripe" }
ianua-integration-salesforce = { path = "integrations/salesforce" }
ianua-integration-telegram = { path = "integrations/telegram" }
ianua-integration-postgres = { path = "integrations/postgres" }
ianua-integration-mysql = { path = "integrations/mysql" }
ianua-integration-redis = { path = "integrations/redis" }
ianua-integration-mongodb = { path = "integrations/mongodb" }
ianua-api = { path = "crates/ianua-api" }
ianua-assembly = { path = "crates/ianua-assembly" }
ianua-infra = { path = "crates/ianua-infra" }
