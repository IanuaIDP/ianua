{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ianua-front.serviceAccountName" . }}
  labels:
    {{- include "ianua-front.labels" . | nindent 4 }}
{{- with .Values.imagePullSecret.existingSecret }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
{{- end }}
