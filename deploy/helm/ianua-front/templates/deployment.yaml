apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ianua-front.fullname" . }}
  labels:
    {{- include "ianua-front.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "ianua-front.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ianua-front.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ianua-front.serviceAccountName" . }}
      {{- with .Values.imagePullSecret.existingSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "ianua-front.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: API_URL
              value: {{ .Values.apiUrl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
