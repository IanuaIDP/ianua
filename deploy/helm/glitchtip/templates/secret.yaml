apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glitchtip.fullname" . }}
  labels:
    {{- include "glitchtip.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secretKey is required (openssl rand -hex 32)" .Values.secretKey | quote }}
  DATABASE_URL: {{ include "glitchtip.databaseUrl" . | quote }}
