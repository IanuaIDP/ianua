{{- $root := . }}
{{- range .Values.agentSandboxes.agents }}
---
{{- /*
An agent's pod reaches its own runner and nothing else: no ianua port, no
internet, no cloud metadata endpoint, no other service, and no DNS, since
lookups can carry data out. Nothing may connect in.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ianua.fullname" $root }}-agent-{{ .name }}
  labels:
    {{- include "ianua.labels" $root | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      ianua.io/sandbox: agent
      ianua.io/agent: {{ .name }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              ianua.io/sandbox: runner
              ianua.io/agent: {{ .name }}
      ports:
        - port: {{ $root.Values.agentSandboxes.runner.port }}
---
{{- /*
A runner takes connections from its own agent only, and reaches the ianua
data plane's agent entry and the API: no internet and no DNS. The runner
addresses ianua by service IP.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ianua.fullname" $root }}-runner-{{ .name }}
  labels:
    {{- include "ianua.labels" $root | nindent 4 }}
    app.kubernetes.io/component: agent-runner
spec:
  podSelector:
    matchLabels:
      ianua.io/sandbox: runner
      ianua.io/agent: {{ .name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              ianua.io/sandbox: agent
              ianua.io/agent: {{ .name }}
      ports:
        - port: {{ $root.Values.agentSandboxes.runner.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ianua.selectorLabels" (dict "root" $root "component" "zero") | nindent 14 }}
      ports:
        - port: {{ $root.Values.zero.internalPort }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "ianua.selectorLabels" (dict "root" $root "component" "server") | nindent 14 }}
      ports:
        - port: {{ $root.Values.server.port }}
{{- end }}
{{- if .Values.agentSandboxes.agents }}
---
{{- /*
The data plane's agent entry trusts the socket peer, so only runners may
reach it. Every other port stays open to every source, as it
was without this policy: the public listeners and any stream-route ports.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ianua.fullname" . }}-zero-agent-entry
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
    app.kubernetes.io/component: zero
spec:
  podSelector:
    matchLabels:
      {{- include "ianua.selectorLabels" (dict "root" . "component" "zero") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 1
          endPort: {{ sub .Values.zero.internalPort 1 }}
        - port: {{ add .Values.zero.internalPort 1 }}
          endPort: 65535
    - from:
        - podSelector:
            matchLabels:
              ianua.io/sandbox: runner
      ports:
        - port: {{ .Values.zero.internalPort }}
{{- end }}
