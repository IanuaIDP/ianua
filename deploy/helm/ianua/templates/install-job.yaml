{{- if include "ianua.selfHosted" . }}
{{/*
`ianua install`: makes the installation's one organization, its first tenant
and its owner from the INSTALL_* settings, after the migration. Once an
organization exists it changes nothing and says so, so it runs on every
upgrade too. The first run prints a one-time setup token to the Job's log,
which confirms the owner's address (see NOTES.txt).

The INSTALL_* settings reach this Job alone, the owner's password from a
Secret of its own: every other command refuses them, so the first password
never stays in a serving pod's environment.
*/}}
{{- $installation := .Values.selfHosted }}
{{- $secret := include "ianua.installSecretName" . }}
{{- if not $installation.owner.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
    app.kubernetes.io/component: install
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  INSTALL_OWNER_PASSWORD: {{ include "ianua.ownerPassword" . | quote }}
---
{{- end }}
{{- $env := list
    (dict "name" "INSTALL_ORGANIZATION_NAME" "value" (required "selfHosted.organizationName is required with deployment.mode=selfHosted" $installation.organizationName))
    (dict "name" "INSTALL_TENANT_NAME" "value" $installation.tenantName)
    (dict "name" "INSTALL_OWNER_EMAIL" "value" (required "selfHosted.owner.email is required with deployment.mode=selfHosted" $installation.owner.email))
    (dict "name" "INSTALL_OWNER_NAME" "value" $installation.owner.name)
    (dict "name" "INSTALL_OWNER_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" $secret "key" "INSTALL_OWNER_PASSWORD")))
}}
{{ include "ianua.commandJob" (dict
    "root" .
    "name" "install"
    "args" (list "install")
    "hook" "post-install,pre-upgrade"
    "weight" 0
    "backoffLimit" 5
    "env" (toYaml $env)
) }}
{{- end }}
