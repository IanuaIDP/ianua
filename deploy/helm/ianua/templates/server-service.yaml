apiVersion: v1
kind: Service
metadata:
  name: {{ include "ianua.fullname" . }}-server
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "ianua.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.service.port | default .Values.server.port }}
      targetPort: http
