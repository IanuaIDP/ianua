{{- if not .Values.internalLinks.existingSecret }}
{{- /*
The internal links' certificates, generated once and read back on every
upgrade: an authority of their own, the API's relay listener and the
gateway calling it, the gateway's workflow listener and the worker calling
it, and the gateway's runner listener. The relay and workflow listeners
complete a handshake only with a certificate of this authority; runners
hold none, check the runner listener against it, and prove themselves with
their agent's key. The authority's key is never kept: nothing is signed after the
first install, so nothing in the cluster can make another certificate the
listeners would take. Issue them yourself with `ianua internal-pki` and name
the Secret in internalLinks.existingSecret to rotate them.
*/}}
{{- $name := include "ianua.internalLinksSecretName" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall like the data it guards, and read back on upgrade.
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{- if $live }}
  {{- range $key, $value := $live.data }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- else }}
{{- $days := int .Values.internalLinks.validityDays }}
{{- $ca := genCA "ianua internal links" $days }}
{{- $relayHost := include "ianua.relayHost" . }}
{{- $workflowHost := include "ianua.workflowHost" . }}
{{- $relay := genSignedCert $relayHost nil (list $relayHost (printf "%s.%s.svc" $relayHost .Release.Namespace)) $days $ca }}
{{- $workflow := genSignedCert $workflowHost nil (list $workflowHost (printf "%s.%s.svc" $workflowHost .Release.Namespace)) $days $ca }}
{{- $runnerHost := include "ianua.runnerHost" . }}
{{- $runner := genSignedCert $runnerHost nil (list $runnerHost (printf "%s.%s.svc" $runnerHost .Release.Namespace)) $days $ca }}
{{- $gateway := genSignedCert "gateway" nil nil $days $ca }}
{{- $worker := genSignedCert "worker" nil nil $days $ca }}
  ca-cert.pem: {{ $ca.Cert | b64enc }}
  relay-listener-cert.pem: {{ $relay.Cert | b64enc }}
  relay-listener-key.pem: {{ $relay.Key | b64enc }}
  workflow-listener-cert.pem: {{ $workflow.Cert | b64enc }}
  workflow-listener-key.pem: {{ $workflow.Key | b64enc }}
  runner-listener-cert.pem: {{ $runner.Cert | b64enc }}
  runner-listener-key.pem: {{ $runner.Key | b64enc }}
  gateway-cert.pem: {{ $gateway.Cert | b64enc }}
  gateway-key.pem: {{ $gateway.Key | b64enc }}
  worker-cert.pem: {{ $worker.Cert | b64enc }}
  worker-key.pem: {{ $worker.Key | b64enc }}
{{- end }}
{{- end }}
