{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ianua.fullname" . }}-secrets
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
  annotations:
    # Created before the migrate, install and operator hooks, which read it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or enable bundled postgresql)" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  HMAC_SECRET: {{ include "ianua.hmacSecret" . | quote }}
  ENCRYPTION_KEY: {{ include "ianua.encryptionKey" . | quote }}
  {{- if .Values.nats.enabled }}
  {{- /* One token, under the bundled NATS's name and the clients'. */}}
  NATS_CREDS_TOKEN: {{ include "ianua.natsToken" . | quote }}
  BUS_TOKEN: {{ include "ianua.natsToken" . | quote }}
  {{- end }}
  {{- if eq .Values.config.email.provider "smtp" }}
  {{- with .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- else if eq .Values.config.email.provider "mailgun" }}
  MAILGUN_API_KEY: {{ .Values.secrets.mailgunApiKey | quote }}
  {{- end }}
  {{- if not (include "ianua.filesOnDisk" .) }}
  FILES_OBJECTS_SECRET_ACCESS_KEY: {{ required "secrets.filesObjectsSecretAccessKey is required with files.store=objects" .Values.secrets.filesObjectsSecretAccessKey | quote }}
  {{- end }}
{{- end }}
