apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ianua.eventSigningSecretName" . }}
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
  annotations:
    # Before the install and operator hooks, which load the server's settings.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  EVENT_SIGNING_SECRET: {{ include "ianua.eventSigningSecret" . | quote }}
