{{- if and .Values.imagePullSecret.create (not .Values.imagePullSecret.existingSecret) }}
{{- $reg := .Values.image.registry }}
{{- $user := required "imagePullSecret.username is required (or set imagePullSecret.existingSecret)" .Values.imagePullSecret.username }}
{{- $pass := required "imagePullSecret.password is required (or set imagePullSecret.existingSecret)" .Values.imagePullSecret.password }}
{{- $auth := printf "%s:%s" $user $pass | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ianua.imagePullSecretName" . }}
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" $reg $user $pass $auth | b64enc }}
{{- end }}
