{{- if .Values.zero.networkPolicy.enabled }}
# The gateway's workflow listener takes connections from the worker alone;
# its other ports stay as open as before. The listener asks the worker's
# certificate and a run pass as well, so this is a third wall: a compromised
# pod elsewhere in the cluster cannot even reach it. Needs a CNI that
# enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ianua.fullname" . }}-zero
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
    app.kubernetes.io/component: zero
spec:
  podSelector:
    matchLabels:
      {{- include "ianua.selectorLabels" (dict "root" . "component" "zero") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.zero.port }}
        - port: {{ .Values.zero.acmePort }}
        - port: {{ .Values.zero.statusPort }}
        {{- if .Values.agentSandboxes.agents }}
        - port: {{ .Values.zero.internalPort }}
        {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "ianua.selectorLabels" (dict "root" . "component" "worker") | nindent 14 }}
      ports:
        - port: {{ .Values.zero.workflowPort }}
{{- end }}
