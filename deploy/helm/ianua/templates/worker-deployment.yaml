apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ianua.fullname" . }}-worker
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  # Every part of the worker is safe on as many workers as there are and to
  # stop at any moment: jobs are claimed under a hold, each sweep round once,
  # and each event handed to one worker at a time. So a rollout may overlap.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "ianua.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ianua.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ianua.workerServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "ianua.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MODE
              value: worker
            {{- include "ianua.databaseUrlEnv" . | nindent 12 }}
            {{- include "ianua.eventSigningEnv" . | nindent 12 }}
            {{- include "ianua.auditSealEnv" . | nindent 12 }}
            {{- include "ianua.privilegedLoginEnv" . | nindent 12 }}
            # Protected apps steps call the gateway's workflow listener over
            # mutual TLS, presenting the worker's certificate.
            - name: GATEWAY_WORKFLOW_URL
              value: "https://{{ include "ianua.workflowHost" . }}:{{ .Values.zero.workflowPort }}"
            - name: GATEWAY_WORKFLOW_CA_FILE
              value: /etc/ianua/internal/ca-cert.pem
            - name: GATEWAY_WORKFLOW_CLIENT_CERT_FILE
              value: /etc/ianua/internal/worker-cert.pem
            - name: GATEWAY_WORKFLOW_CLIENT_KEY_FILE
              value: /etc/ianua/internal/worker-key.pem
            {{- if .Values.codeSandboxes.enabled }}
            # Code steps run in pods of their own in the code namespace,
            # made through this worker's own account.
            - name: SANDBOX_CLUSTER_NAMESPACE
              value: {{ include "ianua.codeSandboxNamespace" . | quote }}
            {{- with .Values.codeSandboxes.runtimeClassName }}
            - name: SANDBOX_CLUSTER_RUNTIME_CLASS
              value: {{ . | quote }}
            {{- end }}
            - name: SANDBOX_CLUSTER_MOST_AT_ONCE
              value: {{ .Values.codeSandboxes.mostAtOnce | quote }}
            - name: SANDBOX_START_GRACE_SECONDS
              value: {{ .Values.codeSandboxes.startGraceSeconds | quote }}
            - name: SANDBOX_CLUSTER_WARM
              value: {{ .Values.codeSandboxes.warm.perKind | quote }}
            - name: SANDBOX_CLUSTER_WARM_MINUTES
              value: {{ .Values.codeSandboxes.warm.minutes | quote }}
            {{- if .Values.codeSandboxes.network.enabled }}
            - name: SANDBOX_PROXY_ADDRESS
              value: "{{ include "ianua.fullname" . }}-sandbox-proxy.{{ .Release.Namespace }}.svc:{{ .Values.codeSandboxes.network.port }}"
            - name: SANDBOX_PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ianua.sandboxProxySecretName" . }}
                  key: SANDBOX_PROXY_KEY
            {{- end }}
            {{- if .Values.codeSandboxes.ownImages.enabled }}
            # Companies' own images run as code steps, scanned first.
            - name: SANDBOX_OWN_IMAGES
              value: "true"
            {{- with .Values.codeSandboxes.ownImages.scanCommand }}
            - name: IMAGE_SCAN_COMMAND
              value: {{ . | quote }}
            {{- end }}
            - name: IMAGE_SCAN_TIMEOUT_SECONDS
              value: {{ .Values.codeSandboxes.ownImages.scanTimeoutSeconds | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            {{- include "ianua.envFrom" . | nindent 12 }}
          # A worker serves no public listener: its probes and its metrics are
          # on the internal one.
          ports:
            - name: internal
              containerPort: {{ .Values.server.internalPort }}
          volumeMounts:
            {{- include "ianua.internalLinksMount" . | nindent 12 }}
            {{- include "ianua.filesVolumeMount" . | nindent 12 }}
          # The listener opens once the worker has brought the schema up to
          # date, which a first install's migration may take a while to do.
          startupProbe:
            httpGet:
              path: /health/live
              port: internal
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: internal
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: internal
            periodSeconds: 15
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "ianua.internalLinksVolume" (dict "root" . "files" (list "ca-cert.pem" "worker-cert.pem" "worker-key.pem")) | nindent 8 }}
        {{- include "ianua.filesVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if and (include "ianua.filesOnDisk" .) (eq .Values.files.disk.accessMode "ReadWriteOnce") }}
      # The file store's volume is ReadWriteOnce, so the worker, which writes
      # exports to it, must run on the node of a server, which serves them.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "ianua.selectorLabels" (dict "root" . "component" "server") | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
