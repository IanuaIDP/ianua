{{- if .Values.nats.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ianua.fullname" . }}-nats
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  selector:
    {{- include "ianua.selectorLabels" (dict "root" . "component" "nats") | nindent 4 }}
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ianua.fullname" . }}-nats
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "ianua.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "ianua.selectorLabels" (dict "root" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ianua.selectorLabels" (dict "root" . "component" "nats") | nindent 8 }}
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          env:
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ianua.secretName" . }}
                  key: NATS_CREDS_TOKEN
          args: ["-js", "-sd", "/data", "-m", "8222", "--auth", "$(NATS_TOKEN)"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.nats.storage }}
{{- end }}
