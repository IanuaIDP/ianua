{{- /*
The API server's relay listener, which only the gateway calls: it relays
requests made at apps' sign-in addresses and asks about agents' approvals
here, over mutual TLS. Always ClusterIP and never named by an ingress, so
changing the public server Service's type cannot expose it. Every request it
takes must also carry the gateway's seal. Its certificate is issued for this
Service's name.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ianua.relayHost" . }}
  labels:
    {{- include "ianua.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    {{- include "ianua.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: relay
      port: {{ .Values.server.relayPort }}
      targetPort: relay
